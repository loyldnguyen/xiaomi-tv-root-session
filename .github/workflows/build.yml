name: Build MT9653 Kernel and Extract Offsets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev python3 python3-pip git curl clang lld llvm gcc-aarch64-linux-gnu
          pip3 install pyelftools

      - name: Clone TCL MT9653 kernel
        run: git clone --depth 1 https://github.com/TCLOpenSource/mt9653.git kernel

      - name: Configure kernel
        run: |
          cd kernel
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            cp arch/arm64/configs/gki_defconfig .config
          else
            make ARCH=arm64 LLVM=1 defconfig
          fi
          if [ -f arch/arm64/configs/mt5896_defconfig ]; then
            cat arch/arm64/configs/mt5896_defconfig >> .config
          else
            echo "WARN: arch/arm64/configs/mt5896_defconfig not found; continuing with base defconfig"
          fi
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld NM=llvm-nm AR=llvm-ar OBJCOPY=llvm-objcopy olddefconfig
          # Vendor UAPI headers (mtk-v4l2-srccap.h et al.) are not self-contained
          # and fail HDRTEST with `struct timespec` incomplete-type errors.
          # Disable the self-test — it is not required to build vmlinux.
          scripts/config --file .config --disable CONFIG_UAPI_HEADER_TEST
          # Also disable BTF generation and module signing to avoid toolchain mismatches.
          scripts/config --file .config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --file .config --disable CONFIG_MODULE_SIG
          scripts/config --file .config --disable CONFIG_MODULE_SIG_ALL
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld NM=llvm-nm AR=llvm-ar OBJCOPY=llvm-objcopy olddefconfig
          echo "--- UAPI_HEADER_TEST / BTF / MODULE_SIG settings after override ---"
          grep -E '^(CONFIG_UAPI_HEADER_TEST|CONFIG_DEBUG_INFO_BTF|CONFIG_MODULE_SIG)[= ]' .config || true
          echo "--- head of .config ---"
          head -40 .config

      - name: Build vmlinux
        continue-on-error: true
        run: |
          set +e  # we want the full log even if make fails
          cd kernel
          ( make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
                 CC=clang LD=ld.lld NM=llvm-nm AR=llvm-ar OBJCOPY=llvm-objcopy \
                 vmlinux -j"$(nproc)" 2>&1 ) | tee build.log
          make_rc=${PIPESTATUS[0]}
          echo "::notice::make vmlinux exit code = ${make_rc}"
          echo "--- tail of build.log (last 120 lines) ---"
          tail -120 build.log
          echo "--- searching for build artefacts ---"
          find . -maxdepth 4 \( -name vmlinux -o -name System.map -o -name '*.elf' \) -printf '%p  %s bytes\n' 2>/dev/null || true
          ls -lh vmlinux System.map 2>/dev/null || true
          exit 0  # never fail here — let the next steps upload the log

      - name: Extract offsets and generate ionstack.conf
        if: always()
        run: |
          cd kernel
          if [ ! -f System.map ]; then
            echo "::warning::No System.map produced; skipping offset extraction. See build.log in artifacts."
            exit 0
          fi
          echo "=== KEY SYMBOLS ==="
          for s in _text init_task init_cred ashmem_fops ashmem_misc selinux_state configfs_write_bin_file noop_llseek sysctl_bootid random_table nfulnl_logger; do
            grep -w "$s" System.map | head -1
          done
          echo "=== CFI ENTRIES ==="
          for s in ashmem_ioctl compat_ashmem_ioctl ashmem_mmap ashmem_open ashmem_release ashmem_show_fdinfo ashmem_read_iter configfs_read_file configfs_write_bin_file noop_llseek; do
            grep "${s}.cfi_jt" System.map | head -1
          done
          python3 <<'PYEOF'
          with open('System.map') as f:
              syms = {}
              for line in f:
                  p = line.strip().split()
                  if len(p) >= 3: syms[p[2]] = int(p[0], 16)
          tb = syms.get('_text', 0)
          def o(n, x=0):
              return (syms[n] - tb + x) if n in syms else None
          def c(n):
              return o(n + '.cfi_jt') or o(n)
          L = [f'kimage_text_base = 0x{tb:x}']
          m = {'random_fops': 'random_misc_fops_off', 'ashmem_fops': 'ashmem_fops_off',
               'init_task': 'init_task_off', 'init_uts_ns': 'init_uts_ns_off',
               'empty_zero_page': 'empty_zero_page_off', 'root_task_group': 'root_task_group_off',
               'selinux_blob_sizes': 'selinux_blob_sizes_off', 'selinux_state': 'selinux_enforcing_off',
               'security_hook_heads': 'security_hook_heads_off', 'kmalloc_caches': 'kmalloc_caches_off',
               'anon_pipe_buf_ops': 'anon_pipe_buf_ops_off'}
          for s, k in m.items():
              v = o(s)
              if v is not None: L.append(f'{k} = 0x{v:08x}')
          v = o('ashmem_misc', 0x10)
          if v: L.append(f'ashmem_misc_fops_off = 0x{v:08x}')
          for s, k in [('ashmem_ioctl','ashmem_ioctl_off'),('compat_ashmem_ioctl','ashmem_compat_ioctl_off'),
              ('ashmem_mmap','ashmem_mmap_off'),('ashmem_open','ashmem_open_off'),
              ('ashmem_release','ashmem_release_off'),('ashmem_show_fdinfo','ashmem_show_fdinfo_off'),
              ('ashmem_read_iter','ashmem_read_iter_off'),('configfs_read_file','configfs_read_file_off'),
              ('configfs_write_bin_file','configfs_write_bin_file_off'),('noop_llseek','noop_llseek_off')]:
              v = c(s)
              if v is not None: L.append(f'{k} = 0x{v:08x}')
          v = c('copy_splice_read') or c('generic_file_splice_read')
          if v: L.append(f'copy_splice_read_off = 0x{v:08x}')
          for s, k, x in [('random_table','slide_random_boot_id_data_off',0x108),
              ('sysctl_bootid','slide_sysctl_bootid_off',0),
              ('loggers','slide_loggers_0_1_off',8),('nfulnl_logger','slide_nfulnl_logger_off',0)]:
              v = o(s, x)
              if v: L.append(f'{k} = 0x{v:08x}')
          conf = '\n'.join(L) + '\n'
          open('ionstack.conf','w').write(conf)
          print(conf)
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mt9653-kernel-offsets
          path: |
            kernel/System.map
            kernel/ionstack.conf
            kernel/.config
            kernel/build.log
          if-no-files-found: warn
          retention-days: 30
